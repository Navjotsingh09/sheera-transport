<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seehra Transport | Coming Soon</title>
    <meta name="description" content="Seehra Transport's new website is launching soon. Professional multi-drop and last-mile delivery solutions across the UK.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
            --dark-blue: #001060;
            --orange: #FF7F00;
            --white: #FFFFFF;
            --gray-bg: #F7F7FA;
            --gray-mid: #666666;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--dark-blue) 0%, #000a3d 100%);
            color: var(--white);
        }
        .wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .logo {
            max-width: 220px;
            width: 60%;
            margin-bottom: 40px;
        }
        h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }
        h1 span {
            color: var(--orange);
        }
        p {
            font-size: 1.05rem;
            color: rgba(255,255,255,0.75);
            max-width: 480px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }
        .contact {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
        }
        .contact a {
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 12px 24px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 999px;
            transition: all 0.25s ease;
        }
        .contact a:hover {
            background: var(--orange);
            border-color: var(--orange);
        }
        footer {
            position: absolute;
            bottom: 24px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="/logo.png" alt="Seehra Transport" class="logo">
        <h1>We're <span>Launching Soon</span></h1>
        <p>Our new website is currently being finalised. Seehra Transport offers professional multi-drop and last-mile delivery solutions across the UK — get in touch below for any enquiries.</p>
        <div class="contact">
            <a href="mailto:info@seehratransport.com">info@seehratransport.com</a>
            <a href="tel:+441234567890">+44 1234 567890</a>
        </div>
    </div>
    <footer>&copy; 2026 Seehra Transport Limited. All rights reserved.</footer>
</body>
</html>
